<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div class="div1">
        <form class="form" >
            <label id="name" class="form-label">Name: <input type="text" id="nameinp" class="form-control"></label><br>
            <h3 class="text-danger small nameerr">Enter a proper name</h3><br>
            <label id="email" class="form-label">Email: <input type="email" id="emailinp" class="form-control"> </label><br>
            <h3 class="text-danger small emailerr" style="display:none;">Email format wrong</h3><br>
            <label for="" id="password" class="form-label">Password: <input type="password" id="passwordinp" class="form-control"></label><br>
            <h3 class="
            text-danger small passerr" style="display:none;">Choose a strong password</h3><br>
            <label id="gender" class="form-label">Gender:
            <select name="" id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="others">Others</option>
            </select>
            </label><br>
            <label for="" class="form-label">Text:</label><br>
             <textarea name="" id="text"></textarea>
             <input type="submit" class="form-control btn btn-primary">
        </form>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>
</html>
